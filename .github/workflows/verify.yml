name: verify-eliashberg

# 目的：在一台干净的第三方机器上，从打包的源码 + 锁定的依赖 rev 重建
# Eliashberg 库，并复跑公理审计。
#
# 注意：GitHub 默认 shell 是 `bash -e`，`cmd > log; rc=$?` 在 cmd 失败时
# 会当场退出，rc 取不到、日志也来不及打印。故每道闸门先 `set +e` 显式
# 关掉 errexit，取到 rc 并打印日志之后，再用 `test $rc -eq 0` 判成败。
# 退出码一律不经管道取（不用 `| tail` / `$( )`），以免红被读成绿。

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 腾出磁盘（mathlib oleans 约 5-6 GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: 记录声称的工具链与依赖
        run: |
          echo "== lean-toolchain =="
          cat lean-toolchain
          echo "== mathlib rev (manifest) =="
          grep -B6 '"name": "mathlib"' lake-manifest.json | grep '"rev"'

      - name: 安装 elan + 锁定的工具链
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.0.0/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: 版本落盘
        run: |
          elan --version
          lake --version
          lean --version

      - name: 闸门0 源码洁净性（无 sorry/admit/axiom/native_decide）
        run: |
          set +e
          grep -rnE 'sorry|admit|^axiom |native_decide' Eliashberg/ Eliashberg.lean
          g=$?
          set -e
          # grep 无命中时返回 1，正是我们要的
          if [ "$g" -eq 0 ]; then
            echo "GATE0 FAIL: 发现 sorry/admit/axiom/native_decide"
            exit 1
          fi
          echo "GATE0 PASS: 无命中"
          echo "模块数 = $(ls Eliashberg/*.lean | wc -l)"
          echo "行数   = $(cat Eliashberg/*.lean Eliashberg.lean | wc -l)"

      - name: 取 mathlib 缓存（按 manifest 锁定的 rev）
        run: |
          set +e
          lake exe cache get
          rc=$?
          set -e
          echo "CACHE_GET_RC=$rc"
          test "$rc" -eq 0

      - name: 闸门1 lake build Eliashberg
        run: |
          set +e
          lake build Eliashberg > build-log.txt 2>&1
          rc=$?
          set -e
          echo "BUILD_RC=$rc"
          echo "---- build-log 末 40 行 ----"
          tail -40 build-log.txt
          test "$rc" -eq 0

      - name: 闸门2 AxiomAudit（NONSTANDARD_COUNT 必须为 0）
        run: |
          set +e
          lake env lean audit/AxiomAudit.lean > axiom-audit.txt 2>&1
          rc=$?
          set -e
          echo "AXIOM_RC=$rc"
          cat axiom-audit.txt
          test "$rc" -eq 0
          grep -q 'NONSTANDARD_COUNT 0' axiom-audit.txt
          # 孤儿模块判据：审计覆盖的模块数必须等于 Eliashberg/ 下的源文件数。
          # lake build 不会碰根文件 import 链之外的文件，却照样报成功——
          # 这条把「文件存在」与「被编译且被审计」钉成同一个数。
          n=$(ls Eliashberg/*.lean | wc -l | tr -d ' ')
          if ! grep -q "CHECKED modules=$n " axiom-audit.txt; then
            echo "GATE2 FAIL: 审计覆盖模块数 ≠ 源文件数 $n（孤儿模块，或有文件未被根文件 import）"
            exit 1
          fi
          echo "GATE2 PASS: 覆盖模块数 = 源文件数 = $n"

      - name: 闸门3 StmtCheck2 非空性（点质量 δ₁ 实例化主定理）
        run: |
          set +e
          lake env lean audit/StmtCheck2.lean > stmtcheck2.txt 2>&1
          rc=$?
          set -e
          echo "STMTCHECK2_RC=$rc"
          cat stmtcheck2.txt
          test "$rc" -eq 0

      - name: 闸门4 StmtCheck 主定理陈述打印
        run: |
          set +e
          lake env lean audit/StmtCheck.lean > stmtcheck.txt 2>&1
          rc=$?
          set -e
          echo "STMTCHECK_RC=$rc"
          cat stmtcheck.txt
          test "$rc" -eq 0

      - name: 闸门5 DiracCheck（Theorem B 等号情形必须住在库内）
        run: |
          set +e
          lake env lean audit/DiracCheck.lean > diracbridge.txt 2>&1
          rc=$?
          set -e
          echo "DIRAC_RC=$rc"
          cat diracbridge.txt
          test "$rc" -eq 0
          grep -q 'DIRAC_BRIDGE_IN_LIBRARY ok' diracbridge.txt

      - name: 上传全部产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-outputs
          path: |
            build-log.txt
            axiom-audit.txt
            stmtcheck.txt
            stmtcheck2.txt
            diracbridge.txt
          if-no-files-found: warn
